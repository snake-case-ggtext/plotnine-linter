name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # oldest supported stack
          - python: "3.10"
            plotnine: "plotnine==0.13.*"
            matplotlib: "matplotlib==3.8.*"
          - python: "3.11"
            plotnine: "plotnine==0.14.*"
            matplotlib: "matplotlib==3.9.*"
          - python: "3.12"
            plotnine: "plotnine==0.15.*"
            matplotlib: "matplotlib==3.10.*"
          # newest
          - python: "3.13"
            plotnine: "plotnine"
            matplotlib: "matplotlib"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "${{ matrix.plotnine }}" "${{ matrix.matplotlib }}"
          pip install -e ".[dev]"
          pip install "${{ matrix.plotnine }}" "${{ matrix.matplotlib }}"  # keep the pinned versions
      - name: Versions
        run: python -c "import plotnine, matplotlib, pandas; print(plotnine.__version__, matplotlib.__version__, pandas.__version__)"
      - name: Test
        run: pytest -q
      - name: Rule docs are current
        run: |
          plotnine-linter rules --markdown > /tmp/RULES.md
          diff -u docs/RULES.md /tmp/RULES.md
