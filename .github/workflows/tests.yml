name: tests

on:
  push:
    branches: [main]
  pull_request:

env:
  UV_LOCKED: "1"  # fail if uv.lock is out of date with pyproject.toml

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"  # slop-lint needs Python 3.12 or later
      - run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: make test

  # The oldest stacks the linter supports. uv.lock pins the newest versions, so
  # these jobs install with pip and pin plotnine and matplotlib by hand.
  compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            pins: "plotnine==0.13.* matplotlib==3.8.* pandas==2.1.* numpy<2"
          - python: "3.11"
            pins: "plotnine==0.14.* matplotlib==3.9.*"
          - python: "3.12"
            pins: "plotnine==0.15.* matplotlib==3.10.*"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade "pip>=25.1"
          pip install -e . --group test ${{ matrix.pins }}
      - name: Versions
        run: python -c "import plotnine, matplotlib, pandas; print(plotnine.__version__, matplotlib.__version__, pandas.__version__)"
      - run: pytest -q
